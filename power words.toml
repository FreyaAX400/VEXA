# ============================================================
# INTENSITY MODIFIERS
# Applied as multipliers to adjacent power words
# ============================================================

[[intensity_modifier]]
word = "kinda"
multiplier = 0.5

[[intensity_modifier]]
word = "slightly"
multiplier = 0.4

[[intensity_modifier]]
word = "really"
multiplier = 1.5

[[intensity_modifier]]
word = "very"
multiplier = 1.5

[[intensity_modifier]]
word = "super"
multiplier = 2.0

[[intensity_modifier]]
word = "extremely"
multiplier = 2.5

[[intensity_modifier]]
word = "so"
multiplier = 1.3

[[intensity_modifier]]
word = "actually"
multiplier = 1.2

# ============================================================
# CONTRASTERS
# Forward scan — partial negation of preceding sentiment
# ============================================================

[[contraster]]
word = "but"
factor = -0.5

[[contraster]]
word = "however"
factor = -0.5

[[contraster]]
word = "though"
factor = -0.4

[[contraster]]
word = "except"
factor = -0.6

# ============================================================
# NEGATORS
# Backward scan — full reversal before power word
# "not good" "isn't great" "never bad"
# ============================================================

[[negator]]
word = "not"

[[negator]]
word = "isn't"

[[negator]]
word = "aren't"

[[negator]]
word = "wasn't"

[[negator]]
word = "never"

[[negator]]
word = "no"

[[negator]]
word = "don't"

[[negator]]
word = "doesn't"

# ============================================================
# TRAJECTORY PHRASES
# Sentence-level positive direction signal
# Nudges Anticipation float on detection
# ============================================================

[[trajectory_phrase]]
phrase = "getting better"

[[trajectory_phrase]]
phrase = "improving"

[[trajectory_phrase]]
phrase = "getting there"

[[trajectory_phrase]]
phrase = "working on it"

[[trajectory_phrase]]
phrase = "almost there"

[[trajectory_phrase]]
phrase = "making progress"
