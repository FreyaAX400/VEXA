# VEXA Power Word Tables
# Loaded by SentimentParser at runtime
# All base_magnitude values POSITIVE — valence carries direction
# Format per entry: word, target float, base_magnitude, valence

# ============================================================
# EVALUATIVE — how she's doing
# ============================================================

